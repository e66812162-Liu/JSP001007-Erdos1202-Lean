name: JSP-001007 V11 Stable 4.34 Independent Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-stable-v434.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof repository
        uses: actions/checkout@v4
        with:
          path: launcher

      - name: Checkout pinned PrimeGapsLib source
        uses: actions/checkout@v4
        with:
          repository: AxiomMath/PrimeGapsLib
          ref: 1faa7b14e82ddebc2772dfb9153922f01b106477
          path: work

      - name: Freeze stable 4.34 dependency graph
        working-directory: work
        run: |
          printf 'leanprover/lean4:v4.34.0\n' > lean-toolchain
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lakefile.toml")
          s = p.read_text()
          s = s.replace(
              'rev = "288f16d9a07189233a9bc5e1c143c38d1f3f4d37"',
              'rev = "5ed2965256430c3649e86755f9576b54eca72435"')
          s = s.replace(
              'rev = "main"\n\n[[lean_lib]]\nname = "PrimeGapsCert"',
              'rev = "09617eb72103690ef22b027548c60a6126e2ef6d"\n\n[[lean_lib]]\nname = "PrimeGapsCert"')
          p.write_text(s)
          PY
          rm -f lake-manifest.json
          cp ../launcher/candidate/*.lean .
          cp ../launcher/run_remote_compile_v11.sh .
          chmod +x run_remote_compile_v11.sh

      - name: Install Lean 4.34.0
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Resolve exact frozen dependencies
        working-directory: work
        run: |
          lake update
          echo "=== lean-toolchain ==="
          cat lean-toolchain
          echo "=== exact core dependency revisions ==="
          python3 - <<'PY'
          import json
          d=json.load(open("lake-manifest.json"))
          for p in d["packages"]:
              if p["name"] in {"mathlib","PrimeNumberTheoremAnd"}:
                  print(p["name"], "inputRev=",p.get("inputRev"), "rev=",p.get("rev"))
          PY

      - name: Restore Mathlib cache
        working-directory: work
        run: lake exe cache get

      - name: Build stable dependency closure
        working-directory: work
        run: |
          lake build Mathlib \
            PrimeGapsTheory.NumberTheory.DyadicPNT \
            PrimeGapsTheory.NumberTheory.PrimeCountingInterval

      - name: Compile full V11 proof and print axioms
        working-directory: work
        run: ./run_remote_compile_v11.sh

      - name: Forbidden-token source audit
        working-directory: work
        run: |
          set -e
          if grep -RInE '\b(sorry|admit|axiom|unsafe|native_decide|skipKernelTC)\b' JSP001007_*.lean; then
            echo "Forbidden token found in JSP proof source."
            exit 1
          else
            echo "No forbidden proof-bypass tokens found in JSP source."
          fi

      - name: Independent Lean kernel checker
        working-directory: work
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          lake env leanchecker JSP001007_Master_SourceFaithful_V11

      - name: Record audit metadata
        if: always()
        working-directory: work
        run: |
          mkdir -p jsp_audit
          {
            echo "Proof repo commit: ${GITHUB_SHA}"
            echo "PrimeGapsLib source: 1faa7b14e82ddebc2772dfb9153922f01b106477"
            echo "Mathlib: 5ed2965256430c3649e86755f9576b54eca72435"
            echo "PrimeNumberTheoremAnd: 09617eb72103690ef22b027548c60a6126e2ef6d"
            lake env lean --version
          } > jsp_audit/metadata.txt
          cp -r jsp_logs jsp_audit/ 2>/dev/null || true

      - name: Upload independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsp001007-v11-stable434-independent-audit
          path: work/jsp_audit/
          if-no-files-found: warn
